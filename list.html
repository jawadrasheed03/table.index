<!DOCTYPE html>
<html>
<head>
    <title>Nested List</title>
</head>
<body>
    <h1>Nested List</h1>

    <ul>
        <li>Fruits
            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Mango</li>
            </ul>
        </li>
        <li>Vegetables
            <ul>
                <li>Potato</li>
                <li>Tomato</li>
                <li>Carrot</li>
            </ul>
        </li>
        <li>Subjects
            <ol>
                <li>English</li>
                <li>Mathematics</li>
                <li>Computer Science
                    <ul>
                        <li>HTML</li>
                        <li>CSS</li>
                        <li>JavaScript</li>
                    </ul>
                </li>
            </ol>
        </li>
    </ul>
</body>
</html>
